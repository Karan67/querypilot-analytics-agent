# QueryPilot - Iteration 0 foundation stack.
#
#   db  : PostgreSQL 16, seeded with Chinook, exposing the read-only role
#   api : FastAPI, reaching db ONLY through that read-only role
#
# Prerequisites:
#   1. cp .env.example .env
#   2. ./db/fetch_chinook.sh      (or db\fetch_chinook.ps1 on Windows)
#   3. docker compose up --build

services:
  db:
    image: postgres:16-alpine
    container_name: querypilot-db
    restart: unless-stopped
    environment:
      # Superuser: used for seeding and for creating the read-only role.
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Consumed by db/init/02_readonly_role.sh
      QUERYPILOT_RO_USER: ${QUERYPILOT_RO_USER}
      QUERYPILOT_RO_PASSWORD: ${QUERYPILOT_RO_PASSWORD}
      QUERYPILOT_STATEMENT_TIMEOUT: ${QUERYPILOT_STATEMENT_TIMEOUT:-10s}
    ports:
      # Iteration 12 T11, AC22. Loopback by default, not every interface.
      #
      # Measured before this line existed: `docker ps` reported
      # `0.0.0.0:5432->5432/tcp`, which is Postgres reachable from any machine
      # that can route to this host at all -- a laptop on a coffee-shop wifi,
      # or any other tenant on the same cloud subnet. Nothing in this project
      # needs that: the host test suite and the eval runner both connect to
      # `localhost`, which `127.0.0.1` answers exactly as well as `0.0.0.0`
      # does, on this same machine. There was no case that needed the wider
      # bind; it was simply Compose's own default, never chosen on purpose.
      #
      # `POSTGRES_BIND_HOST` exists for the one legitimate exception -- a
      # database client on another machine, deliberately -- and is left to be
      # widened on purpose rather than narrowed by an operator who has to
      # remember to do it.
      - "${POSTGRES_BIND_HOST:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Init scripts run in filename order, ONCE, on an empty data volume:
      #   01 loads Chinook, 02 grants SELECT on the tables 01 created.
      # The order is load-bearing: GRANT ... ON ALL TABLES only affects
      # tables that already exist at the moment the grant runs.
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - ./db/seed:/seed:ro
    healthcheck:
      # -h 127.0.0.1 is deliberate. During init the postgres entrypoint runs a
      # temporary server on the unix socket only, so a socket-based check would
      # report healthy while Chinook is still loading. Forcing TCP means
      # healthy == init finished.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s

  # Iteration 14 (specs/017-schema-generality.md). A second, independent
  # Postgres instance seeded with Pagila instead of Chinook -- proof that the
  # engine reads a live catalog rather than Chinook's own, not just an
  # assertion that it should. Opt-in via `--profile pagila`, mirroring the
  # `tls` profile's precedent: exercised, not assumed, and nobody running the
  # default stack pays for a container they didn't ask for.
  #
  # Superuser is deliberately "postgres", not "querypilot" as db's is -- see
  # db/init-pagila/01_load_pagila.sh for why (Pagila's dump owns ~106
  # statements to that name).
  #
  # postgres:18-alpine, not 16 as db's is: every one of Pagila's ~56 uuid
  # columns defaults to uuidv7(), a built-in function that does not exist
  # before Postgres 18 -- measured directly (2026-09-16), the load failed
  # against 16-alpine with "function uuidv7() does not exist". Bumping only
  # this container's version proves the engine against a newer catalog shape
  # too, and does not touch Chinook's tested-and-eval'd 16-alpine service.
  pagila-db:
    image: postgres:18-alpine
    container_name: querypilot-pagila-db
    restart: unless-stopped
    profiles: ["pagila"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: pagila
      # Reused from db's own read-only role config -- a different container,
      # so no collision with Chinook's role of the same name.
      QUERYPILOT_RO_USER: ${QUERYPILOT_RO_USER}
      QUERYPILOT_RO_PASSWORD: ${QUERYPILOT_RO_PASSWORD}
      QUERYPILOT_STATEMENT_TIMEOUT: ${QUERYPILOT_STATEMENT_TIMEOUT:-10s}
    ports:
      - "${PAGILA_BIND_HOST:-127.0.0.1}:${PAGILA_PORT:-5433}:5432"
    volumes:
      # Postgres 18's image expects the mount at the parent directory, not
      # .../data as 16's does -- it now stores data under a major-version
      # subdirectory (pg_ctlcluster-compatible layout). Measured directly:
      # mounting .../data as db's block does refused to start.
      - pagila_data:/var/lib/postgresql
      # 01 loads Pagila; 02_readonly_role.sh (db/init-pagila) is a one-line
      # wrapper that execs db/init/03_readonly_role.sh from this sibling
      # mount, rather than a second copy of that security-relevant script.
      # Nesting the file mount directly inside the already-:ro
      # /docker-entrypoint-initdb.d mount was tried first and fails on Docker
      # Desktop for Windows ("read-only file system" creating the
      # mountpoint) -- a sibling mount avoids that entirely.
      - ./db/init-pagila:/docker-entrypoint-initdb.d:ro
      - ./db/init:/opt/chinook-init:ro
      - ./db/pagila-seed:/seed:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d pagila"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s

  # Iteration 12 T4. The one-shot that makes the volume belong to the account
  # the API now runs as.
  #
  # T2 moved the API off root and onto uid 10001. The Dockerfile creates /data
  # owned by that uid, which is enough for a *fresh* named volume -- Docker
  # copies the image's ownership when it initialises an empty one. It is not
  # enough for a volume that already exists: those keep the ownership they were
  # created with, which for every deployment predating T2 is root. Measured
  # rather than assumed -- the new image against the existing volume answers
  # `touch: cannot touch '/data/probe': Permission denied`.
  #
  # **Why a separate service and not an entrypoint.** A chown at boot needs
  # root, so an entrypoint doing it would have to start the container as root
  # and drop privileges afterwards -- which reintroduces exactly the thing AC1
  # removes, and needs `gosu` or `su-exec` in the runtime image to do it
  # safely. Isolating the privileged step in a container that exits before the
  # API starts keeps the API's own image non-root with no new dependency.
  #
  # It reuses the API's build rather than pulling busybox, so `docker compose
  # up` still needs exactly the two images it needed before. It is idempotent:
  # chown on an already-correct tree is a no-op, so this costs a second or two
  # on every start and nothing else.
  data-init:
    build:
      context: ./api
    container_name: querypilot-data-init
    user: "0:0"
    entrypoint: ["sh", "-c", "chown -R 10001:10001 /data && chmod 700 /data"]
    volumes:
      - querypilot_data:/data
    restart: "no"

  api:
    build:
      context: ./api
    container_name: querypilot-api
    restart: unless-stopped
    environment:
      # The only database credential the API ever holds is the read-only role.
      QUERYPILOT_DATABASE_URL: postgresql+psycopg://${QUERYPILOT_RO_USER}:${QUERYPILOT_RO_PASSWORD}@db:5432/${POSTGRES_DB}
      # Dynamic-database-switching's second registered target (`api/targets.py`).
      # Container-network DSN -- `pagila-db:5432`, not the host-mapped
      # `${PAGILA_PORT}` -- on the same read-only credential as `db`'s, since
      # `db/init-pagila/02_readonly_role.sh` provisions the role from the
      # identical `QUERYPILOT_RO_USER`/`QUERYPILOT_RO_PASSWORD` pair (verified
      # live, 2026-09-16). Harmless to set unconditionally: `pagila-db` is
      # behind `--profile pagila`, so this resolves to nothing reachable
      # unless that profile is also up, and `GET /databases` still reports
      # the target honestly as configured-but-unreachable in that case --
      # the same distinction `/health` already draws for the primary target.
      QUERYPILOT_PAGILA_DATABASE_URL: postgresql+psycopg://${QUERYPILOT_RO_USER}:${QUERYPILOT_RO_PASSWORD}@pagila-db:5432/pagila
      # Iteration 14 (specs/017-schema-generality.md, resolved Q-B). Unset
      # means no glossary at all -- this demo sets it so its own prompt shape
      # is unchanged from before the glossary became configurable. Pointed at
      # a file baked into the image (api/glossary/chinook.json -> COPY . ./api/
      # -> /app/api/glossary/chinook.json), not a bind mount, because it ships
      # with the code, not with the deployment's secrets.
      QUERYPILOT_GLOSSARY_FILE: ${QUERYPILOT_GLOSSARY_FILE:-/app/api/glossary/chinook.json}
      # LLM provider (specs/005-single-shot-generation.md). Provider and model
      # are configuration, not code -- switching either is an environment
      # change (AC3). The key is read from .env, which is gitignored.
      #
      # The default is empty rather than absent: with no key the API still
      # starts and /health still passes, and only a question fails, with a
      # message saying what to set. A container that refused to boot without an
      # LLM key would make the database work unreachable too.
      QUERYPILOT_LLM_PROVIDER: ${QUERYPILOT_LLM_PROVIDER:-groq}
      QUERYPILOT_LLM_MODEL: ${QUERYPILOT_LLM_MODEL:-openai/gpt-oss-120b}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      # Iteration 12 T8. The file form of each secret, and the reason it
      # exists: an environment variable is part of the container's
      # configuration, so `docker inspect querypilot-api` prints it in full, as
      # does anything that can reach the Docker socket. It is also inherited by
      # every child process and readable in /proc/1/environ.
      #
      # Set `GROQ_API_KEY_FILE=/run/secrets/groq_api_key` and mount the file,
      # and the variable above can stay empty. The file form wins when both are
      # set. A path that cannot be read fails closed -- it does *not* fall back
      # to the variable -- and /health reports `source` and `readable` for each
      # secret so the failure is visible without being disclosed.
      #
      # Both default to empty, so the laptop path is unchanged: nothing is
      # mounted, nothing is read from a file, and `.env` keeps working.
      GROQ_API_KEY_FILE: ${GROQ_API_KEY_FILE:-}
      QUERYPILOT_USERS_FILE: ${QUERYPILOT_USERS_FILE:-}
      # Iteration 12 T6. Whose `X-Forwarded-Proto` this deployment believes.
      # Empty means the default: loopback plus the RFC-1918 range Docker
      # allocates bridge networks from, which is what lets the `tls` profile
      # work with no configuration.
      QUERYPILOT_TRUSTED_PROXIES: ${QUERYPILOT_TRUSTED_PROXIES:-}
      # Iteration 12 T9. The daily spend ceiling. 50 questions per
      # identity per day, 150 across the deployment -- both reset at
      # UTC midnight, and both are configuration rather than code.
      QUERYPILOT_DAILY_IDENTITY_LIMIT: ${QUERYPILOT_DAILY_IDENTITY_LIMIT:-50}
      QUERYPILOT_DAILY_GLOBAL_LIMIT: ${QUERYPILOT_DAILY_GLOBAL_LIMIT:-150}
      # Who may spend that quota (Iteration 10, specs/013-auth.md). A JSON
      # object of name to secret, read at request time so rotating a credential
      # is an environment change and not a rebuild (AC9).
      #
      # **No default credential is shipped here, deliberately.** A default
      # secret is worse than none: it survives into a deployment, it is in a
      # public repository, and it looks like a configured system. The default
      # below is *empty*, which fails closed -- every route except /health
      # returns 401, and /health reports `auth.configured: false` with a message
      # naming this variable, so an operator can see why rather than guess.
      #
      # `.env.example` carries a local-development value, on the same terms as
      # the Postgres passwords beside it: copying it is a deliberate act, and
      # `cp .env.example .env && docker compose up -d` has to keep working.
      QUERYPILOT_USERS: ${QUERYPILOT_USERS:-}
      # Operational history (Iteration 7). SQLite, deliberately NOT a schema in
      # the Postgres target: charter §5 wants the metadata store separate, and
      # §4 means the only Postgres credential this container holds is read-only,
      # so it could not write there even if we wanted it to.
      #
      # Stated here as well as defaulted in api/store/history.py, because the
      # path and the mount below have to agree and one of them being implicit is
      # how they stop agreeing.
      QUERYPILOT_HISTORY_PATH: /data/querypilot.db
    volumes:
      # A named volume, mirroring pgdata (resolved D-4). `docker compose down`
      # keeps the history; only `down -v` discards it. A bind mount would make
      # the file easier to open by hand and would also put a .db file in the
      # repository working tree, which is how a gitignored file becomes a
      # committed one. T7's reader is the supported way to look inside.
      - querypilot_data:/data
      # The secrets directory, read-only, mounted from wherever the operator
      # keeps it. Defaults to `./deploy/secrets`, which is gitignored and
      # empty -- so this mount is inert until something is put in it, and the
      # `_FILE` variables above are what actually switch the behaviour on.
      - ${QUERYPILOT_SECRETS_DIR:-./deploy/secrets}:/run/secrets:ro
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      data-init:
        condition: service_completed_successfully
    healthcheck:
      # AC12. Until Iteration 8 T7 only `db` had a healthcheck, so
      # `docker compose ps` reported the API as `Up` whether or not it could
      # serve a request -- and Iteration 0's whole lesson was that a container
      # reporting healthy while broken is worse than one reporting nothing.
      #
      # It probes `/health`, which is the endpoint that already proves the whole
      # chain: the API started, it holds the read-only credential, it can
      # authenticate, and Chinook is loaded. A check on the TCP port would
      # report healthy for a process that accepts connections and cannot answer,
      # which is the failure being closed rather than a smaller version of it.
      #
      # **Python rather than curl**, because `python:3.12.13-slim` has no curl
      # and adding one would put a package in the runtime image to run a
      # liveness probe.
      #
      # As of Iteration 12 T3 this delegates to `api/healthcheck.py` instead of
      # inlining the probe, for one reason: the inlined version hardcoded
      # `http://127.0.0.1:8000/health`, which was the *second* place the port
      # 8000 was written down and had no way of disagreeing out loud with the
      # first. AC6 makes the server bind `$PORT`, so a hardcoded probe would
      # have started checking the wrong port the moment a platform moved it.
      # The script resolves `$PORT` itself and the image declares the same
      # script in its own HEALTHCHECK, so there is exactly one answer to "which
      # port is this service on".
      #
      # The script keeps the two properties the inline version was chosen for:
      # it reads `/health` rather than the TCP port, so a process that accepts
      # connections and cannot answer is reported unhealthy; and it builds its
      # URL from 127.0.0.1 rather than `localhost`, because on a dual-stack
      # resolver `localhost` can pick ::1 while uvicorn is bound to 0.0.0.0.
      test:
        - CMD
        - python
        - -m
        - api.healthcheck
      interval: 15s
      timeout: 10s
      retries: 3
      # The database's own start_period is 60s and this service waits for it, so
      # the API's clock effectively starts after Chinook has loaded. 30s covers
      # uvicorn's import of the app plus the first catalog read.
      start_period: 30s

  # TLS termination, behind `--profile tls` (Iteration 12 T7).
  #
  # Not part of the default stack. `docker compose up -d` is still the two
  # containers it has always been, and the charter's "only setup instruction is
  # docker compose up" property survives. `docker compose --profile tls up -d`
  # adds this one.
  #
  # It exists so the deployment's TLS story is exercised rather than asserted.
  # Caddy's internal CA issues a certificate with no ACME round trip and no
  # public DNS name, so this works on an offline laptop -- which is the whole
  # reason a profile is worth having over a paragraph in the README saying the
  # platform will handle it.
  caddy:
    image: caddy:2.8-alpine
    container_name: querypilot-caddy
    profiles:
      - tls
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      # Deliberately not 80 and 443: this is a development profile and those
      # ports are privileged on Linux and frequently taken on a laptop.
      #
      # The consequence is visible in AC14's test. Caddy's HTTP-to-HTTPS
      # redirect names port 443, because that is the port it is listening on
      # inside its own network namespace, and it has no way to know the host
      # published it somewhere else. The test therefore asserts the redirect's
      # scheme, host and path -- which is what AC14 asks for -- and not its
      # port.
      - "${TLS_HTTP_PORT:-8080}:80"
      - "${TLS_HTTPS_PORT:-8443}:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Named, so the internal CA's root key survives a restart. Without this
      # every `up` mints a new CA and anything that trusted the last one stops
      # trusting this one.
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  pagila_data:
  querypilot_data:
  caddy_data:
  caddy_config:
