# QueryPilot - Iteration 0 foundation stack.
#
#   db  : PostgreSQL 16, seeded with Chinook, exposing the read-only role
#   api : FastAPI, reaching db ONLY through that read-only role
#
# Prerequisites:
#   1. cp .env.example .env
#   2. ./db/fetch_chinook.sh      (or db\fetch_chinook.ps1 on Windows)
#   3. docker compose up --build

services:
  db:
    image: postgres:16-alpine
    container_name: querypilot-db
    restart: unless-stopped
    environment:
      # Superuser: used for seeding and for creating the read-only role.
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Consumed by db/init/02_readonly_role.sh
      QUERYPILOT_RO_USER: ${QUERYPILOT_RO_USER}
      QUERYPILOT_RO_PASSWORD: ${QUERYPILOT_RO_PASSWORD}
      QUERYPILOT_STATEMENT_TIMEOUT: ${QUERYPILOT_STATEMENT_TIMEOUT:-10s}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Init scripts run in filename order, ONCE, on an empty data volume:
      #   01 loads Chinook, 02 grants SELECT on the tables 01 created.
      # The order is load-bearing: GRANT ... ON ALL TABLES only affects
      # tables that already exist at the moment the grant runs.
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - ./db/seed:/seed:ro
    healthcheck:
      # -h 127.0.0.1 is deliberate. During init the postgres entrypoint runs a
      # temporary server on the unix socket only, so a socket-based check would
      # report healthy while Chinook is still loading. Forcing TCP means
      # healthy == init finished.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s

  # Iteration 12 T4. The one-shot that makes the volume belong to the account
  # the API now runs as.
  #
  # T2 moved the API off root and onto uid 10001. The Dockerfile creates /data
  # owned by that uid, which is enough for a *fresh* named volume -- Docker
  # copies the image's ownership when it initialises an empty one. It is not
  # enough for a volume that already exists: those keep the ownership they were
  # created with, which for every deployment predating T2 is root. Measured
  # rather than assumed -- the new image against the existing volume answers
  # `touch: cannot touch '/data/probe': Permission denied`.
  #
  # **Why a separate service and not an entrypoint.** A chown at boot needs
  # root, so an entrypoint doing it would have to start the container as root
  # and drop privileges afterwards -- which reintroduces exactly the thing AC1
  # removes, and needs `gosu` or `su-exec` in the runtime image to do it
  # safely. Isolating the privileged step in a container that exits before the
  # API starts keeps the API's own image non-root with no new dependency.
  #
  # It reuses the API's build rather than pulling busybox, so `docker compose
  # up` still needs exactly the two images it needed before. It is idempotent:
  # chown on an already-correct tree is a no-op, so this costs a second or two
  # on every start and nothing else.
  data-init:
    build:
      context: ./api
    container_name: querypilot-data-init
    user: "0:0"
    entrypoint: ["sh", "-c", "chown -R 10001:10001 /data && chmod 700 /data"]
    volumes:
      - querypilot_data:/data
    restart: "no"

  api:
    build:
      context: ./api
    container_name: querypilot-api
    restart: unless-stopped
    environment:
      # The only database credential the API ever holds is the read-only role.
      QUERYPILOT_DATABASE_URL: postgresql+psycopg://${QUERYPILOT_RO_USER}:${QUERYPILOT_RO_PASSWORD}@db:5432/${POSTGRES_DB}
      # LLM provider (specs/005-single-shot-generation.md). Provider and model
      # are configuration, not code -- switching either is an environment
      # change (AC3). The key is read from .env, which is gitignored.
      #
      # The default is empty rather than absent: with no key the API still
      # starts and /health still passes, and only a question fails, with a
      # message saying what to set. A container that refused to boot without an
      # LLM key would make the database work unreachable too.
      QUERYPILOT_LLM_PROVIDER: ${QUERYPILOT_LLM_PROVIDER:-groq}
      QUERYPILOT_LLM_MODEL: ${QUERYPILOT_LLM_MODEL:-openai/gpt-oss-120b}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      # Who may spend that quota (Iteration 10, specs/013-auth.md). A JSON
      # object of name to secret, read at request time so rotating a credential
      # is an environment change and not a rebuild (AC9).
      #
      # **No default credential is shipped here, deliberately.** A default
      # secret is worse than none: it survives into a deployment, it is in a
      # public repository, and it looks like a configured system. The default
      # below is *empty*, which fails closed -- every route except /health
      # returns 401, and /health reports `auth.configured: false` with a message
      # naming this variable, so an operator can see why rather than guess.
      #
      # `.env.example` carries a local-development value, on the same terms as
      # the Postgres passwords beside it: copying it is a deliberate act, and
      # `cp .env.example .env && docker compose up -d` has to keep working.
      QUERYPILOT_USERS: ${QUERYPILOT_USERS:-}
      # Operational history (Iteration 7). SQLite, deliberately NOT a schema in
      # the Postgres target: charter §5 wants the metadata store separate, and
      # §4 means the only Postgres credential this container holds is read-only,
      # so it could not write there even if we wanted it to.
      #
      # Stated here as well as defaulted in api/store/history.py, because the
      # path and the mount below have to agree and one of them being implicit is
      # how they stop agreeing.
      QUERYPILOT_HISTORY_PATH: /data/querypilot.db
    volumes:
      # A named volume, mirroring pgdata (resolved D-4). `docker compose down`
      # keeps the history; only `down -v` discards it. A bind mount would make
      # the file easier to open by hand and would also put a .db file in the
      # repository working tree, which is how a gitignored file becomes a
      # committed one. T7's reader is the supported way to look inside.
      - querypilot_data:/data
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      data-init:
        condition: service_completed_successfully
    healthcheck:
      # AC12. Until Iteration 8 T7 only `db` had a healthcheck, so
      # `docker compose ps` reported the API as `Up` whether or not it could
      # serve a request -- and Iteration 0's whole lesson was that a container
      # reporting healthy while broken is worse than one reporting nothing.
      #
      # It probes `/health`, which is the endpoint that already proves the whole
      # chain: the API started, it holds the read-only credential, it can
      # authenticate, and Chinook is loaded. A check on the TCP port would
      # report healthy for a process that accepts connections and cannot answer,
      # which is the failure being closed rather than a smaller version of it.
      #
      # **Python rather than curl**, because `python:3.12.13-slim` has no curl
      # and adding one would put a package in the runtime image to run a
      # liveness probe.
      #
      # As of Iteration 12 T3 this delegates to `api/healthcheck.py` instead of
      # inlining the probe, for one reason: the inlined version hardcoded
      # `http://127.0.0.1:8000/health`, which was the *second* place the port
      # 8000 was written down and had no way of disagreeing out loud with the
      # first. AC6 makes the server bind `$PORT`, so a hardcoded probe would
      # have started checking the wrong port the moment a platform moved it.
      # The script resolves `$PORT` itself and the image declares the same
      # script in its own HEALTHCHECK, so there is exactly one answer to "which
      # port is this service on".
      #
      # The script keeps the two properties the inline version was chosen for:
      # it reads `/health` rather than the TCP port, so a process that accepts
      # connections and cannot answer is reported unhealthy; and it builds its
      # URL from 127.0.0.1 rather than `localhost`, because on a dual-stack
      # resolver `localhost` can pick ::1 while uvicorn is bound to 0.0.0.0.
      test:
        - CMD
        - python
        - -m
        - api.healthcheck
      interval: 15s
      timeout: 10s
      retries: 3
      # The database's own start_period is 60s and this service waits for it, so
      # the API's clock effectively starts after Chinook has loaded. 30s covers
      # uvicorn's import of the app plus the first catalog read.
      start_period: 30s

volumes:
  pgdata:
  querypilot_data:
