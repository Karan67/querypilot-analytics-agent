[pytest]
# Repo root on sys.path so tests import the application as "api.*", exactly the
# way the container does. Without this pytest would put tests/ on the path
# instead and "import api.db.introspection" would fail.
pythonpath = .
testpaths = tests

# `--junitxml` is here so a local run keeps its evidence (Iteration 9 T5, B-13).
#
# B-13 is an intermittent failure of the gold-query pair that has never been
# read in full. Both observed occurrences were seen through `-q` output, which
# truncates the assertion to `AssertionError: refer...`, and a re-run passes and
# destroys the evidence. A third occurrence during this iteration was lost the
# same way, to a `tail -4` -- which is the whole argument for a mechanism rather
# than a documented habit: the evidence has to exist before anyone knows they
# need it.
#
# The junit report carries the complete message, in both the `message` attribute
# and the element body, regardless of `-q`. CI has written and uploaded one
# since Iteration 8 T4; this gives a local run the same thing for free.
#
# **A command-line `--junitxml` still wins.** `addopts` is prepended, so CI's
# own `--junitxml="$JUNIT_REPORT"` overrides this and `ci/require_executed_tests.py`
# is unaffected. Verified both ways rather than assumed.
#
# `.pytest_cache/` is already gitignored, and pytest creates the directory if it
# is missing, so this works on a fresh clone with no setup.
#
# `--strict-markers` (Iteration 11 T2) makes an unregistered marker a collection
# error rather than a silent no-op. Without it, `@pytest.mark.needs_database` --
# one plausible misspelling of the marker below -- attaches nothing, the test
# reads as hermetic, and the prohibition fixture fires under a test that plainly
# meant to declare a database. A typo must stop the run, not quietly change what
# a test is.
addopts = -ra --strict-markers --junitxml=.pytest_cache/junit.xml

# The database partition (Iteration 11, B-15).
#
# `needs_db` is **declarative only** -- it does not apply `configured_database`.
# A test that needs Postgres writes both:
#
#     pytestmark = [pytest.mark.needs_db,
#                   pytest.mark.usefixtures("configured_database")]
#
# Two statements of one fact, kept in sync by `tests/test_ci_guards.py`. Having
# the marker inject the fixture would make half of AC3's equality true by
# construction, and an invariant that cannot fail is not an invariant. The same
# reasoning already governs `DEFAULT_FLOOR` against the workflow's argument, and
# the CI interpreter against the Dockerfile's `FROM`.
markers =
    needs_db: reads PostgreSQL. Requests `configured_database`, so it skips when the stack is down; every unmarked test is refused an Engine by `tests/isolation.py`.
    constructs_engine: builds an Engine on purpose, usually to watch it fail against a closed port. Needs no live database and stays in the hermetic lane -- it only tells the prohibition to step aside.

